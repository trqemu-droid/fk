name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Auto-Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/tallyhelper
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "TallyHelper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.example.tallyhelper'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.tallyhelper"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            lint {
                abortOnError = false
                checkReleaseBuilds = false
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <application
                android:allowBackup="true"
                android:label="কার্টুন টালি"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#26231C">
            <WebView
                android:id="@+id/webView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/tallyhelper/MainActivity.java
        package com.example.tallyhelper;

        import android.Manifest;
        import android.app.Activity;
        import android.content.ContentValues;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Environment;
        import android.provider.MediaStore;
        import android.util.Base64;
        import android.webkit.JavascriptInterface;
        import android.webkit.PermissionRequest;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;
        import androidx.activity.result.ActivityResultLauncher;
        import androidx.activity.result.contract.ActivityResultContracts;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.content.ContextCompat;
        import java.io.OutputStream;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;

            private final ActivityResultLauncher<String[]> requestPermissionLauncher =
                registerForActivityResult(new ActivityResultContracts.RequestMultiplePermissions(), permissions -> {
                    Boolean cameraGranted = permissions.get(Manifest.permission.CAMERA);
                    if (cameraGranted == null || !cameraGranted) {
                        Toast.makeText(this, "ক্যামেরা পারমিশন প্রয়োজন", Toast.LENGTH_SHORT).show();
                    }
                });

            private final ActivityResultLauncher<Intent> filePickerLauncher =
                registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                    if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                        Uri[] results = WebChromeClient.FileChooserParams.parseResult(result.getResultCode(), result.getData());
                        if (filePathCallback != null) {
                            filePathCallback.onReceiveValue(results);
                        }
                    } else {
                        if (filePathCallback != null) {
                            filePathCallback.onReceiveValue(null);
                        }
                    }
                    filePathCallback = null;
                });

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                checkPermissions();

                webView = findViewById(R.id.webView);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
                settings.setUseWideViewPort(true);
                settings.setLoadWithOverviewMode(true);

                webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }

                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        MainActivity.this.filePathCallback = filePathCallback;
                        if (fileChooserParams != null) {
                            Intent intent = fileChooserParams.createIntent();
                            try {
                                filePickerLauncher.launch(intent);
                                return true;
                            } catch (Exception e) {
                                MainActivity.this.filePathCallback = null;
                                return false;
                            }
                        }
                        return false;
                    }
                });

                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }

            private void checkPermissions() {
                List<String> list = new ArrayList<>();
                list.add(Manifest.permission.CAMERA);
                if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P) {
                    list.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                }
                List<String> notGranted = new ArrayList<>();
                for (String p : list) {
                    if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                        notGranted.add(p);
                    }
                }
                if (!notGranted.isEmpty()) {
                    requestPermissionLauncher.launch(notGranted.toArray(new String[0]));
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }

            public class WebAppInterface {
                @JavascriptInterface
                public void savePdf(String base64Data, String fileName) {
                    try {
                        String cleanBase64 = base64Data.contains(",") ? base64Data.split(",")[1] : base64Data;
                        byte[] pdfBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                        ContentValues contentValues = new ContentValues();
                        contentValues.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                        contentValues.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                            contentValues.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                        }

                        Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, contentValues);
                        if (uri != null) {
                            OutputStream outputStream = getContentResolver().openOutputStream(uri);
                            if (outputStream != null) {
                                outputStream.write(pdfBytes);
                                outputStream.close();
                            }
                            runOnUiThread(() -> Toast.makeText(MainActivity.this, "PDF সফলভাবে সেভ হয়েছে Downloads ফোল্ডারে!", Toast.LENGTH_LONG).show());
                        }
                    } catch (Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "PDF সেভ হতে সমস্যা হয়েছে: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                    }
                }
            }
        }
        EOF

        cp index.html app/src/main/assets/index.html || cp *.html app/src/main/assets/index.html

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.5"

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TallyHelper-APK
        path: app/build/outputs/apk/debug/*.apk
