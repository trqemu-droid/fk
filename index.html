    --ink:#26231C;

    --card:#F7F1E2;
    --line:#C9B98F;

  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Bengali','Oswald',sans-serif;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 14px),

    min-height:100vh;
